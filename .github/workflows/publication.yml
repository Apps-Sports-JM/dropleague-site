# Publication du site dropleague.app par GitHub Pages (source « GitHub Actions »).
# - À chaque push sur main : le site entier est publié, avec la page Classement fabriquée à la volée.
# - Toutes les 15 minutes : la page Classement est relue ; le site n'est republié que si le classement a changé.
# La page Classement n'est jamais commitée : l'historique public du dépôt ne garde aucun pseudo (voir _outils/LISEZMOI.md).
name: Publication du site
on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: false
# Deux tâches, comme le modèle officiel de GitHub : l'archive du site est déposée par « construire » et lue par
# « deployer ». Dans une seule tâche, le déploiement cherchait parfois l'archive avant que GitHub ne la liste
# (échec « No artifacts named github-pages » du 24/11/2026, deux fois de suite).
jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publier: ${{ steps.decision.outputs.publier }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Préparer le site
        run: rsync -a --exclude '.git' --exclude '.github' --exclude '_outils' --exclude '_site' --exclude '.gitignore' ./ _site/
      - name: Classement de La Bagarre Générale
        id: classement
        continue-on-error: true
        run: node _outils/classement.cjs --sortie _site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - name: Garder la page en ligne si la base n'a pas répondu
        if: steps.classement.outcome == 'failure'
        run: |
          mkdir -p _site/la-bagarre-generale/classement
          curl -fsS https://dropleague.app/la-bagarre-generale/classement/ -o _site/la-bagarre-generale/classement/index.html || echo "Pas de page en ligne à reprendre"
      - name: Garder la tâche planifiée active
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publication.yml/enable" || true
      - name: Décider s'il faut republier
        id: decision
        run: echo "publier=${{ github.event_name != 'schedule' || steps.classement.outputs.change == 'true' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v3
        if: steps.decision.outputs.publier == 'true'
        with:
          path: _site
  deployer:
    needs: construire
    if: needs.construire.outputs.publier == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
